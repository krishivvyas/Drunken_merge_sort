ther</text><text class="cue u2 count" x="728" y="34" opacity="0">5 blocks</text><text class="cue u3 caption" x="380" y="356" opacity="0">fuse [5] + [9] - max 5 &lt;= min 9, so they lock together</text><text class="cue u3 count" x="728" y="34" opacity="0">4 blocks</text><text class="cue u4 caption" x="380" y="356" opacity="0">stumble 2 - the blocks stagger into a random new order</text><text class="cue u4 count" x="728" y="34" opacity="0">4 blocks</text><text class="cue u5 caption" x="380" y="356" opacity="0">absorb: lone 8 falls strictly inside its neighbour -&gt; [5, 8, 9]</text><text class="cue u5 count" x="728" y="34" opacity="0">3 blocks</text><text class="cue u6 caption" x="380" y="356" opacity="0">absorb: lone 3 falls strictly inside its neighbour -&gt; [1, 3, 6]</text><text class="cue u6 count" x="728" y="34" opacity="0">2 blocks</text><text class="cue u7 caption" x="380" y="356" opacity="0">passed out - no two blocks left can ever fuse</text><text class="cue u7 count" x="728" y="34" opacity="0">2 blocks</text></svg>